<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Test IAT</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:#e9ecef; -webkit-tap-highlight-color: transparent; }
  #app { max-width:480px; margin:0 auto; min-height:100vh; max-height:100vh; overflow-y:auto; background:white; display:flex; flex-direction:column; }
  .schermo { display:flex; flex-direction:column; padding:clamp(12px, 3vw, 24px); }
  h1,h2,h3 { text-align:center; }
  h2 { font-size: clamp(20px, 3vw, 26px); }
  input, select, button { font-size:16px; }
  input, select { width:100%; padding:12px; margin:6px 0 14px; border:1px solid #ccc; border-radius:6px; }
  #pulsante-continua, #campo-conferma { padding:16px; width:100%; background:#343a40; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
  .barra-categorie { display:flex; justify-content:space-between; align-items:flex-start; font-weight:bold; font-size:clamp(13px, 2vw, 17px); padding:10px 4px; gap:8px; }
  .barra-categorie span { flex:1; white-space:normal; word-break:break-word; line-height:1.3; }
  .barra-categorie span:first-child { text-align:left; }
  .barra-categorie span:last-child { text-align:right; }
.parola-centro { 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  text-align: center; 
  /* 1. Abbiamo ridotto il padding (es. minimo 4px, massimo 16px) */
  padding: clamp(4px, 2vh, 16px) 0; 
} 

.parola-centro h1 { 
  font-size: clamp(28px, 6vw, 46px); 
  margin: 0; 
  /* 2. Resetta l'altezza della linea per eliminare lo spazio extra del font */
  line-height: 1; 
}
  .pulsanti-risposta { display:flex; gap:clamp(8px, 2vw, 16px); padding-bottom:10px; }
  .pulsante-lato { flex:1; padding:clamp(18px, 3vw, 26px) 8px; font-size:clamp(14px, 2vw, 18px); font-weight:bold; border:3px solid #343a40; border-radius:10px; background:white; color:#343a40; cursor:pointer; transition:background .1s; }
  .pulsante-lato:active { background:#343a40; color:white; }
  @media (hover:hover) { .pulsante-lato:hover { background:#f1f3f5; } .pulsante-lato:hover:active { background:#343a40; } }
  .x-rossa { position:fixed; top:45%; left:0; right:0; text-align:center; font-size:70px; color:#c0392b; font-weight:bold; pointer-events:none; }
  #errore-form { color:#c0392b; font-size:13px; min-height:18px; text-align:center; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th,td { padding:6px; border-bottom:1px solid #dee2e6; }
  th { background:#343a40; color:white; }

  /* Tablet e desktop: la card si allarga e si centra, invece di restare
     una striscia stretta; il resto (font, pulsanti) scala con clamp() già sopra */
  @media (min-width: 640px) {
    #app { max-width:700px; margin:32px auto; border-radius:14px; box-shadow:0 6px 30px rgba(0,0,0,0.10); min-height:auto; max-height:none; }
    .pulsante-lato { padding-top:34px; padding-bottom:34px; }
  }
  @media (min-width: 1024px) {
    #app { max-width:820px; margin:48px auto; }
  }
</style>
</head>
<body>
<div id="app"><div class="schermo" id="schermo"><p style="text-align:center;">Caricamento...</p></div></div>

<!-- Invio dati verso Apps Script tramite form nascosto + iframe invisibile:
     a differenza di fetch()/XMLHttpRequest, una submission di form HTML
     verso un altro dominio funziona in modo affidabile anche con i
     redirect che Apps Script usa internamente, senza richiedere nessuna
     intestazione CORS sulla risposta (che Apps Script spesso non manda). -->
<iframe name="iframe-invio-nascosto" style="display:none;"></iframe>
<form id="form-invio-dati" method="POST" target="iframe-invio-nascosto" style="display:none;">
  <input type="hidden" name="payload" id="campo-payload">
</form>
<div style="position:fixed;bottom:4px;right:6px;font-size:10px;color:#ccc;z-index:9999;">versione pagina: v4-device-ordine-fisso</div>

<script>
// ============================================================
// sostituisci qui sotto l'URL con quello del TUO Google Apps Script
// (vedi istruzioni "come collegare Google Sheet" a parte).
// ============================================================
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfh6ZXJQOahPkkx7MnlpZ_YP1JCtDv-zIkWuunNuywTX9MqupyGUu-3aD0nSpvx7IDvQ/exec";

var schermo = document.getElementById('schermo');
var REGIONI = ["Abruzzo","Basilicata","Calabria","Campania","Emilia-Romagna","Friuli-Venezia Giulia","Lazio","Liguria","Lombardia","Marche","Molise","Piemonte","Puglia","Sardegna","Sicilia","Toscana","Trentino-Alto Adige","Umbria","Valle d'Aosta","Veneto"];

var target_femminile = ['Giulia','Rossella','Asia','Giada','Rosa','Alessia'];
var target_maschile = ['Luca','Mario','Samuele','Gabriele','Filippo','Federico'];

var argomenti = [
  { id:'motori', titolo:'MOTORI', etichettaA:'Guida goffa', etichettaB:'Guida esperta',
    attrA:['Graffia la fiancata','Sbaglia strada','Frena in ritardo','Effettua un sorpasso pericoloso','Viola il codice della strada'],
    attrB:['Guida con sicurezza','Parcheggia bene','Frena in tempo','Effettua un sorpasso in sicurezza','Rispetta il codice della strada'] },
  { id:'corpo', titolo:'CORPO', etichettaA:'Cura elaborata', etichettaB:'Cura essenziale',
    attrA:['Fa la manicure regolarmente','Fa la skincare','Effettua la depilazione','Si pesa regolarmente',"Ha l'armadio pieno di vestiti","Manifesta una preoccupazione eccessiva per l'aumento di peso"],
    attrB:['Usa solo sapone ed acqua','Si pettina e basta','Indossa pochi accessori','Non si preoccupa troppo di mettere peso','Usa solo lo shampoo per lavarsi i capelli','Non possiede molti capi'] },
  { id:'domestico', titolo:'RUOLI DOMESTICI', etichettaA:'Mansioni per la cura e pulizia', etichettaB:'Mansioni per la manutenzione tecnica',
    attrA:['Stira i capi di casa','Lava i piatti',"Passa l'aspirapolvere",'Rifà i letti','Porta i/le figli/figlie dal pediatra','Assiste una persona di famiglia malata'],
    attrB:['Ripara il rubinetto','Aggiusta la presa elettrica','Cambia la lampadina','Controlla una perdita',"Taglia l'erba del giardino",'Usa il trapano'] }
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

// Rileva se il test viene fatto da cellulare o da pc/tablet, in automatico
// (lo studente non deve indicarlo lui): usiamo lo user agent del browser,
// lo stesso metodo che usano la maggior parte dei siti per questo scopo.
function rilevaDispositivo(){
  var mobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
  return mobile ? 'cellulare' : 'pc';
}

var trials = [];          // dati raccolti, uno per trial
var extra = { dispositivo: rilevaDispositivo() };  // id/età/sesso/regione/dispositivo/ordine..., uniti a ogni trial
var timeline = [];
var indice = -1;

function avanti(){
  indice++;
  if (indice >= timeline.length) { return fineTest(); }
  timeline[indice]();
}
function registra(record){
  trials.push(Object.assign({trial_index: indice}, extra, record));
  avanti();
}

// schermata di solo testo, avanza al tocco
function schermataTesto(html){
  return function(){
    schermo.innerHTML = html + "<button id='pulsante-continua' style='margin-top:20px;'>Continua</button>";
    document.getElementById('pulsante-continua').onclick = function(){ registra({trial_type:'istruzioni'}); };
  };
}

var PAESI = ["Italia","Francia","Germania","Spagna","Svizzera","Romania","Albania","Regno Unito","Altro paese europeo","Paese extraeuropeo"];

// modulo iniziale id/età/sesso/paese/regione
function schermataDatiPartecipante(){
  return function(){
    var opzRegioni = REGIONI.map(r => "<option value='"+r+"'>"+r+"</option>").join("");
    var opzPaesi = PAESI.map(p => "<option value='"+p+"'>"+p+"</option>").join("");
    schermo.innerHTML =
      "<h2>Prima di iniziare</h2><p style='color:#555;font-size:14px;text-align:center;'>Questi dati servono solo per l'analisi statistica in forma aggregata.</p>"+
      "<label>Codice identificativo</label><input id='c-id' type='text'>"+
      "<label>Età</label><input id='c-eta' type='number' min='16' max='99'>"+
      "<label>Genere</label><select id='c-sesso'><option value=''>-- seleziona --</option><option>Femmina</option><option>Maschio</option><option>Preferisco non specificare</option></select>"+
      "<label>Paese di residenza</label><select id='c-paese'><option value=''>-- seleziona --</option>"+opzPaesi+"</select>"+
      "<div id='blocco-regione'><label>Regione di residenza</label><select id='c-regione'><option value=''>-- seleziona --</option>"+opzRegioni+"</select></div>"+
      "<div id='errore-form'></div><button id='campo-conferma'>Continua</button>";

    var bloccoRegione = document.getElementById('blocco-regione');
    document.getElementById('c-paese').onchange = function(){
      var mostraRegione = this.value === 'Italia';
      bloccoRegione.style.display = mostraRegione ? '' : 'none';
      if (!mostraRegione) document.getElementById('c-regione').value = '';
    };

    document.getElementById('campo-conferma').onclick = function(){
      var id = document.getElementById('c-id').value.trim();
      var eta = parseInt(document.getElementById('c-eta').value, 10);
      var sesso = document.getElementById('c-sesso').value;
      var paese = document.getElementById('c-paese').value;
      var regione = paese === 'Italia' ? document.getElementById('c-regione').value : '';
      if (!id || !eta || !sesso || !paese || (paese==='Italia' && !regione)){ document.getElementById('errore-form').textContent = "Compila tutti i campi."; return; }
      if (isNaN(eta) || eta<16 || eta>99){ document.getElementById('errore-form').textContent = "Età non valida."; return; }
      extra = Object.assign(extra, {participant_id:id, eta:eta, sesso:sesso, paese:paese, regione:regione});
      registra({trial_type:'dati-partecipante'});
    };
  };
}

// un trial dello IAT con due pulsanti a tocco (sinistra/destra)
// numeroTest (1-4) e domanda (il testo della consegna di questa fase) sono
// stati aggiunti solo per essere salvati nel json di ogni prova, come
// richiesto: non cambiano nulla di cosa vede o come risponde lo studente.
function trialIat(parola, categoria, lato, etichettaSx, etichettaDx, blocco, topicId, condizione, numeroTest, domanda){
  return function(){
    var inizio = performance.now();
    var numeroErrori = 0, primoLato = null, rtPrimoTentativo = null;
    schermo.innerHTML =
      "<div class='barra-categorie'><span>"+[].concat(etichettaSx).join(' / ')+"</span><span>"+[].concat(etichettaDx).join(' / ')+"</span></div>"+
      "<div class='parola-centro'><h1>"+parola+"</h1></div>"+
      "<div class='pulsanti-risposta'>"+
      "<button class='pulsante-lato' id='btn-sx'>◀ SINISTRA<br><span style='font-weight:normal;font-size:0.85em;'>"+"</span></button>"+
      "<button class='pulsante-lato' id='btn-dx'>DESTRA ▶<br><span style='font-weight:normal;font-size:0.85em;'>"+"</span></button></div>";

    function tocco(latoScelto){
      var rt = performance.now() - inizio;
      if (primoLato === null){ primoLato = latoScelto; rtPrimoTentativo = rt; }
      if (latoScelto === lato){
        registra({
          rt: rt, rt_primo_tentativo: rtPrimoTentativo, correct: numeroErrori===0, numero_errori: numeroErrori,
          risposta: latoScelto, primo_lato_scelto: primoLato,
          stimulus_name: parola, category: categoria, block: blocco, topic: topicId, condizione: condizione,
          numero_test: numeroTest, domanda_test: domanda,
          etichetta_sinistra: [].concat(etichettaSx).join(' / '), etichetta_destra: [].concat(etichettaDx).join(' / '),
          trial_type: 'iat-touch'
        });
      } else {
        numeroErrori++;
        var x = document.createElement('div'); x.className='x-rossa'; x.textContent='✕';
        document.body.appendChild(x); setTimeout(()=>x.remove(), 300);
      }
    }
    document.getElementById('btn-sx').onpointerdown = function(){ tocco('left'); };
    document.getElementById('btn-dx').onpointerdown = function(){ tocco('right'); };
  };
}

function timelineArgomento(argomento, stereoPrima){
  var fasi = [];
  fasi.push(schermataTesto("<h2>"+argomento.titolo+"</h2><p style='text-align:center;'>Tocca Continua per iniziare il primo test.</p>"));

  var domandaTest1 = "Smista i NOMI in LEI (sinistra) o LUI (destra).";
  fasi.push(schermataTesto("<h3>Test 1</h3><p style='text-align:center;'>LEI è in alto a sinistra, LUI in alto a destra. Tocca SINISTRA o DESTRA a seconda del nome mostrato.</p>"));
  var t1 = [];
  target_femminile.forEach(w=>t1.push(trialIat(w,'femminile','left',['LEI'],['LUI'],'test1_target',argomento.id,null,1,domandaTest1)));
  target_maschile.forEach(w=>t1.push(trialIat(w,'maschile','right',['LEI'],['LUI'],'test1_target',argomento.id,null,1,domandaTest1)));
  fasi = fasi.concat(shuffle(t1));

  var domandaTest2 = "Smista le ATTIVITÀ in "+argomento.etichettaA.toUpperCase()+" (sinistra) o "+argomento.etichettaB.toUpperCase()+" (destra).";
  fasi.push(schermataTesto("<h3>Test 2</h3><p style='text-align:center;'>"+argomento.etichettaA.toUpperCase()+" è in alto a sinistra, "+argomento.etichettaB.toUpperCase()+" in alto a destra. Tocca SINISTRA o DESTRA a seconda dell'attività mostrata.</p>"));
  var t2 = [];
  argomento.attrA.forEach(w=>t2.push(trialIat(w,'attrA','left',[argomento.etichettaA],[argomento.etichettaB],'test2_attributo',argomento.id,null,2,domandaTest2)));
  argomento.attrB.forEach(w=>t2.push(trialIat(w,'attrB','right',[argomento.etichettaA],[argomento.etichettaB],'test2_attributo',argomento.id,null,2,domandaTest2)));
  fasi = fasi.concat(shuffle(t2));

  function blocco(femminileConA, numeroTest){
    var ts=[], sx = femminileConA?['LEI',argomento.etichettaA]:['LUI',argomento.etichettaA];
    var dx = femminileConA?['LUI',argomento.etichettaB]:['LEI',argomento.etichettaB];
    var cond = femminileConA?'stereotipica':'controstereotipica';
    var domandaCombinata = "Smista NOMI e ATTIVITÀ tra "+sx.join(' + ')+" (sinistra) e "+dx.join(' + ')+" (destra).";
    target_femminile.forEach(w=>ts.push(trialIat(w,'lei',femminileConA?'left':'right',sx,dx,'combinato',argomento.id,cond,numeroTest,domandaCombinata)));
    target_maschile.forEach(w=>ts.push(trialIat(w,'lui',femminileConA?'right':'left',sx,dx,'combinato',argomento.id,cond,numeroTest,domandaCombinata)));
    argomento.attrA.forEach(w=>ts.push(trialIat(w,'attrA','left',sx,dx,'combinato',argomento.id,cond,numeroTest,domandaCombinata)));
    argomento.attrB.forEach(w=>ts.push(trialIat(w,'attrB','right',sx,dx,'combinato',argomento.id,cond,numeroTest,domandaCombinata)));
    var nota = numeroTest===3 ? "Le stesse parole di prima ora vanno smistate con le nuove categorie qui sopra."
      : "Attenzione: sono le STESSE parole del test precedente, ma le categorie si sono scambiate di lato: il pulsante giusto per ogni parola è quindi opposto a prima.";
    fasi.push(schermataTesto("<h3>Test "+numeroTest+"</h3><p style='text-align:center;'>Categorie combinate:<br>"+sx.join(' o ')+" / "+dx.join(' o ')+"</p><p style='color:#7f8c8d;font-size:14px;text-align:center;'>"+nota+"</p>"));
    fasi = fasi.concat(shuffle(ts));
  }
  blocco(stereoPrima, 3);
  blocco(!stereoPrima, 4);
  return fasi;
}

function fineTest(){
  function media(a){ return a.reduce((x,y)=>x+y,0)/a.length; }
  function deviazioneStandard(a){
    var m = media(a);
    var varCampionaria = a.reduce((s,x)=>s+(x-m)*(x-m),0) / (a.length-1);
    return Math.sqrt(varCampionaria);
  }
  // Stesso identico calcolo del D-score qui serve solo per dare
  // un riscontro immediato allo studente, il valore ufficiale resta quello
  // ricalcolato dalla docente sui dati salvati.
  function calcolaDScore(topicId){
    var t = trials.filter(tr=>tr.trial_type==='iat-touch' && tr.block==='combinato' && tr.topic===topicId && tr.rt<10000);
    var stereo = t.filter(tr=>tr.condizione==='stereotipica');
    var contro = t.filter(tr=>tr.condizione==='controstereotipica');
    if (!stereo.length || !contro.length) return null;

    var rtStereoValidi = stereo.filter(tr=>tr.rt>=300).map(tr=>tr.rt);
    var rtControValidi = contro.filter(tr=>tr.rt>=300).map(tr=>tr.rt);
    if (!rtStereoValidi.length || !rtControValidi.length) return null;

    var erroreStereo = 1 - (stereo.filter(tr=>tr.correct).length / stereo.length);
    var erroreContro = 1 - (contro.filter(tr=>tr.correct).length / contro.length);

    var mediaStereo = media(rtStereoValidi) + 600*erroreStereo;
    var mediaContro = media(rtControValidi) + 600*erroreContro;
    var sd = deviazioneStandard(stereo.map(tr=>tr.rt).concat(contro.map(tr=>tr.rt)));
    if (!sd) return null;
    return (mediaContro - mediaStereo) / sd;
  }

  function sintesi(topicId){
    var t = trials.filter(t=>t.trial_type==='iat-touch' && t.block==='combinato' && t.topic===topicId && t.rt<10000);
    var s = t.filter(t=>t.condizione==='stereotipica').map(t=>t.rt);
    var c = t.filter(t=>t.condizione==='controstereotipica').map(t=>t.rt);
    if(!s.length || !c.length) return null;
    return {mS:Math.round(media(s)), mC:Math.round(media(c))};
  }

  function frasePerD(d){
    if (d === null) return "dati insufficienti per calcolare il punteggio";
    var assoluto = Math.abs(d);
    var intensita = assoluto < 0.15 ? "trascurabile" : assoluto < 0.35 ? "lieve" : assoluto < 0.65 ? "moderata" : "marcata";
    if (assoluto < 0.15) return "punteggio vicino allo zero: nessuna associazione implicita rilevante";
    return "associazione implicita " + intensita + ", " + (d > 0 ? "nella direzione stereotipica" : "nella direzione opposta allo stereotipo");
  }

  // riga di riepilogo per partecipante (un D-score per argomento): la
  // riconosce dal trial_type e la scrive in un foglio SEPARATO
  // ("riepilogo"), cosi' da avere sia i dati grezzi sia, gia' pronta,
  // la tabella un-rigo-per-partecipante che serve per lo studio aggregato.
  var dScorePerArgomento = {};
  var riepilogoPartecipante = Object.assign({ trial_type: 'riepilogo-dscore' }, extra);
  argomenti.forEach(a=>{
    var d = calcolaDScore(a.id);
    dScorePerArgomento[a.id] = d;
    riepilogoPartecipante['d_score_'+a.id] = d===null ? '' : Number(d.toFixed(3));
  });
  trials.push(riepilogoPartecipante);

  var pacchetto = JSON.stringify(trials);

  function scaricaBackup(){
    var blob = new Blob([pacchetto], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'dati_iat_'+(extra.participant_id||'anonimo')+'.json';
    document.body.appendChild(a); // necessario su molti browser mobili: un click su un elemento non ancora nella pagina viene ignorato
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // Il file JSON si scarica SEMPRE sul dispositivo dello studente, non solo
  // se l'invio al foglio Google fallisce: serve alla docente come copia
  // individuale da raccogliere (es. su Drive) per l'analisi di popolazione
  // con lo script Python, indipendentemente dall'esito dell'invio al foglio.
  scaricaBackup();

  // L'invio al foglio Google parte SUBITO, in background, mentre lo
  // studente scorre le schermate di risultato: cosi' quando arriva
  // all'ultima schermata l'esito (riuscito o no) è quasi sempre già noto.
  var statoInvio = APPS_SCRIPT_URL.indexOf('INCOLLA_QUI') !== -1 ? 'non-configurato' : 'in-corso';
  function aggiornaStatoSeSullUltimaSchermata(){
    // se l'esito dell'invio arriva mentre lo studente è già sull'ultima
    // schermata (caso raro, solo per chi tocca "Avanti" molto rapidamente),
    // la ridisegna cosi' mostra l'esito vero invece di "Invio in corso..."
    if (typeof mostraPagina === 'function' && schermoSuUltima) mostraPagina(pagine.length - 1);
  }

  if (statoInvio !== 'non-configurato') {
    // Invio tramite form nascosto + iframe invisibile (vedi commento HTML):
    // più affidabile di fetch()/XHR per i redirect interni di Apps Script.
    var formInvio = document.getElementById('form-invio-dati');
    var iframeInvio = document.querySelector("iframe[name='iframe-invio-nascosto']");

    document.getElementById('campo-payload').value = pacchetto;
    formInvio.action = APPS_SCRIPT_URL;

    iframeInvio.onload = function () {
      if (statoInvio === 'ok') return; // l'iframe può scatenare "load" più di una volta
      statoInvio = 'ok';
      aggiornaStatoSeSullUltimaSchermata();
    };
    // di riserva: se l'iframe non dà mai segnale di "load" su qualche
    // browser, dopo 4 secondi consideriamo comunque l'invio avvenuto
    setTimeout(function () {
      if (statoInvio === 'in-corso') { statoInvio = 'ok'; aggiornaStatoSeSullUltimaSchermata(); }
    }, 4000);

    formInvio.submit();
  }

  // ------------------------------------------------------------------
  // 6 SCHERMATE DI RISULTATO IN SEQUENZA (richiesta della docente): una
  // pagina per argomento con i tempi medi delle due combinazioni, poi
  // una pagina per argomento con il punteggio D. Lo studente avanza
  // toccando "Avanti"; sull'ultima compare anche l'esito dell'invio.
  // ------------------------------------------------------------------
  function paginaTempi(a){
    var s = sintesi(a.id);
    if (!s) return "<h3>"+a.titolo+"</h3><p style='text-align:center;color:#7f8c8d;'>Dati insufficienti per questo argomento.</p>";
    return "<h3>"+a.titolo+" — Tempi di risposta</h3>"+
      "<p style='text-align:center;'>Tempo medio delle risposte che <b>confermano</b> lo stereotipo:<br><span style='font-size:22px;'>"+s.mS+" ms</span></p>"+
      "<p style='text-align:center;'>Tempo medio delle risposte che <b>NON confermano</b> lo stereotipo:<br><span style='font-size:22px;'>"+s.mC+" ms</span></p>";
  }
  function paginaDScore(a){
    var d = dScorePerArgomento[a.id];
    var dTesto = d===null ? "n.d." : d.toFixed(2);
    return "<h3>"+a.titolo+" — Punteggio D</h3>"+
      "<p style='text-align:center;font-size:30px;font-weight:bold;'>"+dTesto+"</p>"+
      "<p style='text-align:center;'>"+frasePerD(d)+"</p>"+
      "<p style='font-size:12px;color:#7f8c8d;text-align:center;margin-top:10px;'>Il punteggio può variare da <b>-2</b> a <b>+2</b>: se vicino allo zero implica nessuna associazione implicita rilevante; più si allontana dallo zero (in positivo), più forte sarà l'associazione in direzione dello stereotipo; più si allontana dallo zero (in negativo), più forte sarà l'associazione in direzione contraria allo stereotipo. Non è un giudizio sulla persona: riflette solo i tempi di reazione in questo test.</p>";
  }

  function testoStato(){
    if (statoInvio === 'ok') return "<p style='font-size:13px;color:#2e7d32;text-align:center;'>Dati inviati. Grazie!</p>";
    if (statoInvio === 'fallito' || statoInvio === 'non-configurato') return "<p style='font-size:13px;color:#b45309;text-align:center;'>Invio al server non riuscito: una copia di riserva è stata scaricata sul telefono, invia il file alla docente.</p>";
    return "<p style='font-size:13px;color:#7f8c8d;text-align:center;'>Invio in corso...</p>";
  }

  var pagine = argomenti.map(paginaTempi).concat(argomenti.map(paginaDScore));
  var schermoSuUltima = false;

  function mostraPagina(i){
    var isUltima = i === pagine.length - 1;
    schermoSuUltima = isUltima;
    var extraFinale = isUltima ? testoStato() : "";
    schermo.innerHTML = "<div>"+pagine[i]+"</div>"+extraFinale+
      "<button id='pulsante-avanti-risultati' style='margin-top:20px;'>"+(isUltima ? 'Fine' : 'Avanti')+"</button>";
    document.getElementById('pulsante-avanti-risultati').onclick = function(){
      if (!isUltima) mostraPagina(i+1);
    };
  }
  mostraPagina(0);
}

// ---------------- avvio ----------------
timeline.push(schermataDatiPartecipante());
timeline.push(schermataTesto(
  "<h2>Test di associazione implicita</h2><p style='text-align:center;'>Prevede 3 argomenti, ciascuno con 4 fasi. In ogni fase vedrai due categorie: una in alto a sinistra e una in alto a destra. Ad ogni parola (attività o nomi), tocca <b>SINISTRA</b> se la parola appartiene alla categoria mostrata in alto a sinistra, <b>DESTRA</b> se appartiene a quella in alto a destra. Rispondi il più velocemente possibile restando accurato/a. Se sbagli, dovrai correggere prima di proseguire.</p>"
));
var ordine = shuffle(argomenti);
var stereoPrima = true; // la docente vuole sempre la combinazione stereotipica (Test 3) prima, e quella controstereotipica (Test 4) dopo: niente più randomizzazione di questo ordine
extra.ordine_argomenti = ordine.map(a=>a.id).join(' > ');
extra.ordine_blocchi_combinati = stereoPrima ? 'stereotipica_prima' : 'controstereotipica_prima';
ordine.forEach(a => { timeline = timeline.concat(timelineArgomento(a, stereoPrima)); });

avanti();
</script>
